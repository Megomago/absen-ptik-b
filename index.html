<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahasigma PTIK B - Absensi</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <h1>MAHA<span style="color: #ffffff;">SIGMA</span> <span1 style="color: #39f500;">PTIK B</span1></h1>
  <div id="saveInfo">-</div>
</header>

<main>
  <div class="panel">
    <div class="row">
      <div class="field"><label>Matkul</label><select id="courseSelect"></select></div>
      <div class="field"><label>P</label>
        <div style="display:flex;gap:4px">
          <button id="meetMinus">−</button>
          <input type="number" id="meetCount" min="1" max="30" value="16" style="min-width:50px;width:56px;text-align:center">
          <button id="meetPlus">+</button>
        </div>
      </div>
      <div class="field"><label>Cari</label><input type="text" id="search" placeholder="..."></div>
      <div class="field"><label>Filter</label>
        <select id="filter" style="min-width:110px">
          <option value="all">Semua</option>
          <option value="kritis">&lt;75%</option>
          <option value="belum">Kosong</option>
        </select>
      </div>
      <div class="field"><label>&nbsp;</label>
        <div style="display:flex;gap:6px">
          <button class="primary" id="btnHadirSemua">✅</button>
          <button id="btnExport">CSV</button>
          <button id="btnReset" class="danger">Reset</button>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>Mhs</small><b id="stMhs">30</b></div>
      <div class="stat"><small>P</small><b id="stMeet">16</b></div>
      <div class="stat"><small>Hadir</small><b id="stHadir">0</b></div>
      <div class="stat"><small>Avg</small><b id="stAvg">0%</b></div>
      <div class="stat"><small>&lt;75%</small><b id="stKritis">0</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="align-items:center">
      <div class="brushes" id="brushes">
        <button data-brush="H" class="active" title="Hadir (H)">✅</button>
        <button data-brush="S" title="Sakit (S)">🤒</button>
        <button data-brush="A" title="Alpha (A)">❌</button>
        <button data-brush="E" title="Hapus (Del)">🧽</button>
      </div>
      <label class="mini"><input type="checkbox" id="dragMode" checked> Drag</label>
      <label class="mini"><input type="checkbox" id="cycleMode"> Siklus</label>
    </div>
  </div>

  <div class="table-wrap">
    <table id="tabel">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="hint">✅=H &nbsp; 🤒=S &nbsp; ❌=A &nbsp; • Keys: H S A Del + panah</div>

  <div class="panel">
    <div class="row">
      <div class="field"><div style="display:flex;gap:4px"><input type="text" id="newNama" placeholder="Nama" style="min-width:140px"><input type="text" id="newNim" placeholder="NIM" style="min-width:90px"><button id="btnAddOne" title="Matkul ini saja">+ Ini</button><button id="btnAddAll" title="Semua matkul">+ Semua</button></div></div>
      <div class="field"><div style="display:flex;gap:4px"><input type="text" id="newMatkul" placeholder="Matkul"><button id="btnAddMatkul">+</button></div></div>
    </div>
  </div>
</main>

<script src="data-matkul.js"></script>
<script src="data-mahasiswa.js"></script>
<script src="supabase-config.js"></script>
<script>
const EMOT = {H:"✅", S:"🤒", A:"❌", "":""};
const NEXT = {"":"H","H":"S","S":"A","A":""};

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LS_KEY = "mahasigma_absensi_current";
let state = { courses:[...DEFAULT_COURSES], students:JSON.parse(JSON.stringify(DEFAULT_STUDENTS)), meetings:{}, data:{}, roster:{}, rosterReady:false, rosterAll:true, current:DEFAULT_COURSES[0] };
let cloudReady = false, bulkLock = false, suppressRealtime = false;

function defaultMeetings(){ const o={}; state.courses.forEach(c=>o[c]=16); return o; }

function setSaveInfo(t, isErr){
  const el = document.getElementById("saveInfo");
  el.textContent = t;
  el.style.color = isErr ? "#f87171" : "#9ca3af";
}
function timeNow(){ return new Date().toLocaleTimeString("id-ID",{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

// simpan lokal (cache pilihan matkul) + indikator UI
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({current:state.current})); }catch(e){}
  setSaveInfo("💾 " + timeNow());
}
function getVal(course, sid, meet){ return (state.data[course]?.[sid]?.[meet]) || ""; }
function setVal(course, sid, meet, v){
  if(!state.data[course]) state.data[course]= {};
  if(!state.data[course][sid]) state.data[course][sid]= {};
  if(!v) delete state.data[course][sid][meet];
  else state.data[course][sid][meet]=v;
  if(!bulkLock) cloudUpsertCell(course, sid, meet, v);
}

// ---- Supabase sync ----
async function cloudUpsertCell(course, sid, meet, v){
  if(!cloudReady) return;
  try{
    suppressRealtime = true;
    if(!v) await sb.from("attendance").delete().match({course, student_id:sid, meeting:meet});
    else await sb.from("attendance").upsert({course, student_id:sid, meeting:meet, status:v},{onConflict:"course,student_id,meeting"});
    setSaveInfo("☁ " + timeNow());
  }catch(e){ setSaveInfo("⚠ offline - tersimpan lokal", true); }
  finally{ setTimeout(()=>suppressRealtime=false, 800); }
}
async function cloudSaveMeeting(course){
  if(!cloudReady) return;
  try{
    suppressRealtime = true;
    await sb.from("courses").upsert({name:course, meetings:state.meetings[course]},{onConflict:"name"});
    setSaveInfo("☁ " + timeNow());
  }catch(e){}
  finally{ setTimeout(()=>suppressRealtime=false, 800); }
}
async function bulkSyncCourse(course){
  if(!cloudReady) return;
  try{
    suppressRealtime = true;
    const rows = [];
    const per = state.data[course] || {};
    Object.entries(per).forEach(([sid, meets])=>{
      Object.entries(meets).forEach(([m, v])=>{
        if(v) rows.push({course, student_id:sid, meeting:+m, status:v});
      });
    });
    await sb.from("attendance").delete().eq("course", course);
    if(rows.length) {
      // upsert per 200 biar aman
      for(let i=0;i<rows.length;i+=200){
        await sb.from("attendance").upsert(rows.slice(i,i+200),{onConflict:"course,student_id,meeting"});
      }
    }
    setSaveInfo("☁ " + timeNow());
  }catch(e){ setSaveInfo("⚠ offline", true); }
  finally{ setTimeout(()=>suppressRealtime=false, 1000); }
}

async function load(){
  setSaveInfo("⏳ menghubungkan...");
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const c=JSON.parse(raw); if(c.current) state.current=c.current; } }catch(e){}
  try{
    let {data: courses} = await sb.from("courses").select("*").limit(5000);
    let {data: students} = await sb.from("students").select("*").limit(5000);
    let {data: att} = await sb.from("attendance").select("*").limit(10000);

    // seed pertama kali kalau kosong
    if((!courses || !courses.length) && (!students || !students.length)){
      await sb.from("courses").upsert(DEFAULT_COURSES.map(c=>({name:c, meetings:16})),{onConflict:"name"});
      await sb.from("students").upsert(DEFAULT_STUDENTS.map(s=>({id:s.id, nim:s.nim, nama:s.nama, jk:s.jk||""})),{onConflict:"id"});
      const r1 = await sb.from("courses").select("*").limit(5000);
      const r2 = await sb.from("students").select("*").limit(5000);
      courses = r1.data; students = r2.data; att = [];
    }

    if(courses?.length){
      state.courses = courses.map(c=>c.name);
      state.meetings = {};
      courses.forEach(c=>state.meetings[c.name]=c.meetings||16);
    } else state.meetings = defaultMeetings();
    if(students?.length) state.students = students.map(s=>({id:s.id, nim:s.nim, nama:s.nama, jk:s.jk}));
    if(!state.courses.includes(state.current)) state.current = state.courses[0];

    try{
      const {data: enr, error: enrErr} = await sb.from("enrollments").select("*").limit(10000);
      if(enrErr) throw enrErr;
      state.roster = {};
      (enr||[]).forEach(e=>{ (state.roster[e.course] ||= []).push(e.student_id); });
      state.rosterReady = true; state.rosterAll = false;
      if(!enr?.length && state.students.length && state.courses.length){
        const rows=[];
        state.courses.forEach(c=>state.students.forEach(s=>rows.push({course:c, student_id:s.id})));
        rows.forEach(r=>(state.roster[r.course] ||= []).push(r.student_id));
        (async()=>{ try{ for(let i=0;i<rows.length;i+=500) await sb.from("enrollments").upsert(rows.slice(i,i+500),{onConflict:"course,student_id"}); }catch(e){} })();
      }
      ensureRosterKeys();
      const ids=new Set(state.students.map(s=>s.id));
      Object.keys(state.roster).forEach(c=>state.roster[c]=state.roster[c].filter(id=>ids.has(id)));
    }catch(e){ state.rosterReady=false; state.rosterAll=true; }

    state.data = {};
    (att||[]).forEach(a=>{
      if(!state.data[a.course]) state.data[a.course]={};
      if(!state.data[a.course][a.student_id]) state.data[a.course][a.student_id]={};
      state.data[a.course][a.student_id][a.meeting]=a.status;
    });
    cloudReady = true;
    setSaveInfo("☁ tersambung " + timeNow());
    subscribeRealtime();
  }catch(e){
    console.error(e);
    state.meetings = defaultMeetings();
    setSaveInfo("⚠ offline - pakai data bawaan", true);
  }
}

async function reloadAttendance(){
  const {data} = await sb.from("attendance").select("*").eq("course", state.current).limit(10000);
  state.data[state.current] = {};
  (data||[]).forEach(a=>{
    if(!state.data[a.course]) state.data[a.course]={};
    if(!state.data[a.course][a.student_id]) state.data[a.course][a.student_id]={};
    state.data[a.course][a.student_id][a.meeting]=a.status;
  });
}
async function reloadStudents(){
  const {data} = await sb.from("students").select("*").limit(5000);
  if(data) state.students = data.map(s=>({id:s.id, nim:s.nim, nama:s.nama, jk:s.jk}));
}
async function reloadCourses(){
  const {data} = await sb.from("courses").select("*").limit(5000);
  if(data?.length){
    const cur = state.current;
    state.courses = data.map(c=>c.name);
    state.meetings = {};
    data.forEach(c=>state.meetings[c.name]=c.meetings||16);
    if(!state.courses.includes(cur)) state.current = state.courses[0];
    ensureRosterKeys();
  }
}

function ensureRosterKeys(){
  if(!(state.rosterReady && !state.rosterAll)) return;
  const all=state.students.map(s=>s.id);
  state.courses.forEach(c=>{ if(!state.roster[c]) state.roster[c]=[...all]; });
}
async function reloadEnrollments(){
  try{
    const {data, error} = await sb.from("enrollments").select("*").limit(10000);
    if(error) throw error;
    state.roster = {};
    (data||[]).forEach(e=>{ (state.roster[e.course] ||= []).push(e.student_id); });
    state.rosterReady = true; state.rosterAll = false;
    ensureRosterKeys();
  }catch(e){}
}
function enrolledStudents(){
  if(!state.rosterReady || state.rosterAll) return [...state.students];
  const map=new Map(state.students.map(s=>[s.id,s]));
  return (state.roster[state.current]||[]).map(id=>map.get(id)).filter(Boolean);
}

function subscribeRealtime(){
  sb.channel("absensi-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"attendance"}, async ()=>{
      if(suppressRealtime || bulkLock) return;
      await reloadAttendance();
      render();
      setSaveInfo("☁ update absen " + timeNow());
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"students"}, async ()=>{
      if(suppressRealtime || bulkLock) return;
      await reloadStudents();
      render();
      setSaveInfo("☁ update mhs " + timeNow());
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"courses"}, async ()=>{
      if(suppressRealtime || bulkLock) return;
      await reloadCourses();
      save(); render();
      setSaveInfo("☁ update matkul " + timeNow());
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"enrollments"}, async ()=>{
      if(suppressRealtime || bulkLock) return;
      await reloadEnrollments();
      render();
      setSaveInfo("☁ update peserta " + timeNow());
    })
    .subscribe();
}

const $ = id => document.getElementById(id);
let brush = "H", selected = null, isPainting = false, paintValue = null;

function renderCourseSelect(){
  const sel = $("courseSelect"); sel.innerHTML="";
  state.courses.forEach(c=>{
    const o=document.createElement("option"); o.value=c; o.textContent=c;
    if(c===state.current) o.selected=true;
    sel.appendChild(o);
  });
}

function hitungRekap(sid){
  const course=state.current, n=state.meetings[course];
  let h=0,s=0,a=0,k=0;
  for(let m=0;m<n;m++){ const v=getVal(course,sid,m); if(v==="H")h++; else if(v==="S")s++; else if(v==="A")a++; else k++; }
  const pct = n? Math.round(h/n*100) : 0;
  return {h,s,a,k,pct};
}

function visibleStudents(){
  const q=$("search").value.trim().toLowerCase(), f=$("filter").value;
  return enrolledStudents().filter(st=>{
    if(q && !(st.nama.toLowerCase().includes(q)||st.nim.toLowerCase().includes(q))) return false;
    const r=hitungRekap(st.id);
    if(f==="kritis" && r.pct>=75) return false;
    if(f==="belum" && r.k===0) return false;
    return true;
  });
}

function render(){
  renderCourseSelect();
  const course=state.current, n=state.meetings[course];
  $("meetCount").value=n; $("stMeet").textContent=n;

  let th=`<tr><th class="col-no">No</th><th class="col-nama">Nama</th><th class="col-nim">NIM</th>`;
  for(let m=0;m<n;m++){
    th+=`<th>P${m+1}<div class="col-tools"><button data-fill="${m}">✅</button><button data-clear="${m}">∅</button></div></th>`;
  }
  th+=`<th class="rekap">H</th><th class="rekap">S</th><th class="rekap">A</th><th class="rekap">%</th></tr>`;
  $("thead").innerHTML=th;

  const list=visibleStudents(), tb=$("tbody"); tb.innerHTML="";
  list.forEach((st,idx)=>{
    const r=hitungRekap(st.id);
    const tr=document.createElement("tr");
    tr.dataset.sid=st.id;
    let tds=`<td class="col-no">${idx+1}</td>
      <td class="col-nama">${st.nama} <button data-del="${st.id}" style="float:right;border:none;color:#999">✕</button></td>
      <td class="col-nim">${st.nim}</td>`;
    for(let m=0;m<n;m++){
      const v=getVal(course,st.id,m);
      tds+=`<td><button class="cell" data-s="${v}" data-sid="${st.id}" data-meet="${m}">${EMOT[v]||'<span style="color:#cbd5e1">·</span>'}</button></td>`;
    }
    const cls = r.pct<75 ? "kritik" : "aman";
    tds+=`<td class="rekap">${r.h}</td><td class="rekap">${r.s}</td><td class="rekap">${r.a}</td><td class="rekap ${cls}">${r.pct}</td>`;
    tr.innerHTML=tds;
    tb.appendChild(tr);
  });

  let th2=0, krit=0;
  const enrolled=enrolledStudents();
  enrolled.forEach(st=>{ const r=hitungRekap(st.id); th2+=r.h; if(r.pct<75) krit++; });
  const totalSel = enrolled.length*n || 1;
  $("stMhs").textContent=enrolled.length;
  $("stHadir").textContent=th2;
  $("stAvg").textContent=Math.round(th2/totalSel*100)+"%";
  $("stKritis").textContent=krit;
  wireCells();
  if(selected) markSelected();
}

function wireCells(){
  document.querySelectorAll(".cell").forEach(btn=>{
    btn.onmousedown = e=>{
      e.preventDefault();
      const cycle=$("cycleMode").checked;
      const sid=btn.dataset.sid, m=+btn.dataset.meet;
      if(cycle){
        const cur=getVal(state.current,sid,m);
        setVal(state.current,sid,m,NEXT[cur]); save(); render();
        selectCell(sid,m);
      } else {
        paintValue = brush==="E" ? "" : brush;
        isPainting=true;
        setVal(state.current,sid,m,paintValue); save(); render();
        selectCell(sid,m);
      }
    };
    btn.onmouseenter = e=>{
      if(isPainting && $("dragMode").checked){
        const sid=btn.dataset.sid, m=+btn.dataset.meet;
        if(getVal(state.current,sid,m)!==paintValue){ setVal(state.current,sid,m,paintValue); }
        btn.dataset.s=paintValue; btn.innerHTML=EMOT[paintValue]||'<span style="color:#cbd5e1">·</span>';
      }
    };
    btn.onmouseup = ()=>{ if(isPainting){isPainting=false; save(); render();} };
    btn.onclick = e=>{ selectCell(btn.dataset.sid, +btn.dataset.meet); };
  });
  document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=async ()=>{
    const m=+b.dataset.fill;
    bulkLock = true;
    visibleStudents().forEach(st=>setVal(state.current,st.id,m,"H"));
    bulkLock = false;
    save(); render();
    await bulkSyncCourse(state.current);
  });
  document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=async ()=>{
    const m=+b.dataset.clear;
    bulkLock = true;
    visibleStudents().forEach(st=>setVal(state.current,st.id,m,""));
    bulkLock = false;
    save(); render();
    await bulkSyncCourse(state.current);
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm("Keluarkan dari matkul ini?")) return;
    const delId = b.dataset.del, course = state.current;
    if(state.roster[course]) state.roster[course]=state.roster[course].filter(id=>id!==delId);
    if(state.data[course]?.[delId]) delete state.data[course][delId];
    save(); render();
    try{ suppressRealtime=true;
      await sb.from("enrollments").delete().match({course, student_id:delId});
      await sb.from("attendance").delete().match({course, student_id:delId});
    }catch(err){}
    finally{ setTimeout(()=>suppressRealtime=false, 800); }
  });
}
document.addEventListener("mouseup", ()=>{ if(isPainting){isPainting=false; save(); render();} });

function selectCell(sid,m){ selected={sid,m}; markSelected(); }
function markSelected(){
  document.querySelectorAll(".cell").forEach(c=>{
    c.classList.toggle("selected", selected && c.dataset.sid===selected.sid && +c.dataset.meet===selected.m);
  });
}

document.addEventListener("keydown", e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(!selected) return;
  const k=e.key.toLowerCase();
  let v=null, move=null;
  if(k==="h") v="H"; else if(k==="s") v="S"; else if(k==="a"||k==="x") v="A";
  else if(k==="delete"||k==="backspace") v="";
  else if(k==="arrowright") move=[0,1];
  else if(k==="arrowleft") move=[0,-1];
  else if(k==="arrowdown") move=[1,0];
  else if(k==="arrowup") move=[-1,0];
  else return;
  e.preventDefault();
  if(v!==null){ setVal(state.current,selected.sid,selected.m,v); save(); render(); markSelected(); }
  if(move){
    const rows=visibleStudents(); const n=state.meetings[state.current];
    let ri=rows.findIndex(r=>r.id===selected.sid), ci=selected.m;
    ri=Math.min(Math.max(ri+move[0],0),rows.length-1);
    ci=Math.min(Math.max(ci+move[1],0),n-1);
    selected={sid:rows[ri].id,m:ci}; markSelected();
    const el=document.querySelector(`.cell[data-sid="${selected.sid}"][data-meet="${selected.m}"]`);
    el?.scrollIntoView({block:"nearest",inline:"nearest"});
  }
});

$("courseSelect").onchange = e=>{ state.current=e.target.value; selected=null; save(); render(); };
$("meetCount").onchange = e=>{ let v=Math.min(Math.max(+e.target.value||1,1),30); state.meetings[state.current]=v; save(); render(); cloudSaveMeeting(state.current); };
$("meetPlus").onclick = ()=>{ state.meetings[state.current]=Math.min(state.meetings[state.current]+1,30); save(); render(); cloudSaveMeeting(state.current); };
$("meetMinus").onclick = ()=>{ state.meetings[state.current]=Math.max(state.meetings[state.current]-1,1); save(); render(); cloudSaveMeeting(state.current); };
$("search").oninput = render;
$("filter").onchange = render;
$("brushes").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  brush=b.dataset.brush;
  document.querySelectorAll("#brushes button").forEach(x=>x.classList.toggle("active",x===b));
};
$("btnHadirSemua").onclick = async ()=>{
  if(!confirm("✅ semua?")) return;
  const n=state.meetings[state.current];
  bulkLock = true;
  visibleStudents().forEach(st=>{ for(let m=0;m<n;m++) setVal(state.current,st.id,m,"H"); });
  bulkLock = false;
  save(); render();
  await bulkSyncCourse(state.current);
};
$("btnReset").onclick = async ()=>{
  if(!confirm("Reset?")) return;
  delete state.data[state.current]; save(); render();
  try{ suppressRealtime=true; await sb.from("attendance").delete().eq("course", state.current); }catch(e){}
  finally{ setTimeout(()=>suppressRealtime=false, 800); }
};
async function addStudent(mode){
  const nama=$("newNama").value.trim();
  let nim=$("newNim").value.trim();
  if(!nama) return;
  if(!nim) nim="5252451"+String(state.students.length+1).padStart(3,"0");
  let st=state.students.find(s=>s.nim===nim);
  try{ suppressRealtime=true;
    if(!st){
      st={id:"mhs-"+Date.now(),nim,nama,jk:""};
      state.students.push(st);
      await sb.from("students").upsert({id:st.id, nim:st.nim, nama:st.nama, jk:""},{onConflict:"id"});
    }
    if(state.rosterReady && !state.rosterAll){
      const targets = mode==="all" ? state.courses : [state.current];
      targets.forEach(c=>{ (state.roster[c] ||= []).includes(st.id) || state.roster[c].push(st.id); });
      await sb.from("enrollments").upsert(targets.map(c=>({course:c, student_id:st.id})),{onConflict:"course,student_id"});
    }
  }catch(e){}
  finally{ setTimeout(()=>suppressRealtime=false, 800); }
  $("newNama").value=""; $("newNim").value=""; save(); render();
}
$("btnAddOne").onclick = ()=>addStudent("one");
$("btnAddAll").onclick = ()=>addStudent("all");
$("btnAddMatkul").onclick = async ()=>{
  const v=$("newMatkul").value.trim(); if(!v) return;
  if(state.courses.includes(v)) return;
  state.courses.push(v); state.meetings[v]=16; state.current=v;
  if(state.rosterReady && !state.rosterAll){
    state.roster[v]=state.students.map(s=>s.id);
    try{ await sb.from("enrollments").upsert(state.students.map(s=>({course:v, student_id:s.id})),{onConflict:"course,student_id"}); }catch(e){}
  }
  $("newMatkul").value=""; save(); render();
  try{ suppressRealtime=true; await sb.from("courses").upsert({name:v, meetings:16},{onConflict:"name"}); }catch(e){}
  finally{ setTimeout(()=>suppressRealtime=false, 800); }
};
$("btnExport").onclick = ()=>{
  const course=state.current, n=state.meetings[course];
  let csv="No;NIM;Nama;"+Array.from({length:n},(_,i)=>"P"+(i+1)).join(";")+";H;S;A;%\n";
  enrolledStudents().forEach((st,i)=>{
    const r=hitungRekap(st.id);
    const row=Array.from({length:n},(_,m)=>getVal(course,st.id,m)||"-").join(";");
    csv+=`${i+1};${st.nim};"${st.nama}";${row};${r.h};${r.s};${r.a};${r.pct}\n`;
  });
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="absensi-"+course.replace(/\s+/g,"-")+".csv";
  a.click();
};

render(); load().then(()=>render());
</script>
</body>
</html>

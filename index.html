<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahasigma PTIK B - Absensi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MAHA<span style="color: #ffffff;">SIGMA</span> <span1 style="color: #39f500;">PTIK B</span1></h1>
  <div id="saveInfo">-</div>
</header>

<main>
  <div class="panel">
    <div class="row">
      <div class="field"><label>Matkul</label><select id="courseSelect"></select></div>
      <div class="field"><label>P</label>
        <div style="display:flex;gap:4px">
          <button id="meetMinus">−</button>
          <input type="number" id="meetCount" min="1" max="30" value="16" style="min-width:50px;width:56px;text-align:center">
          <button id="meetPlus">+</button>
        </div>
      </div>
      <div class="field"><label>Cari</label><input type="text" id="search" placeholder="..."></div>
      <div class="field"><label>Filter</label>
        <select id="filter" style="min-width:110px">
          <option value="all">Semua</option>
          <option value="kritis">&lt;75%</option>
          <option value="belum">Kosong</option>
        </select>
      </div>
      <div class="field"><label>&nbsp;</label>
        <div style="display:flex;gap:6px">
          <button class="primary" id="btnHadirSemua">✅</button>
          <button id="btnExport">CSV</button>
          <button id="btnReset" class="danger">Reset</button>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>Mhs</small><b id="stMhs">30</b></div>
      <div class="stat"><small>P</small><b id="stMeet">16</b></div>
      <div class="stat"><small>Hadir</small><b id="stHadir">0</b></div>
      <div class="stat"><small>Avg</small><b id="stAvg">0%</b></div>
      <div class="stat"><small>&lt;75%</small><b id="stKritis">0</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="align-items:center">
      <div class="brushes" id="brushes">
        <button data-brush="H" class="active" title="Hadir (H)">✅</button>
        <button data-brush="S" title="Sakit (S)">🤒</button>
        <button data-brush="A" title="Alpha (A)">❌</button>
        <button data-brush="E" title="Hapus (Del)">🧽</button>
      </div>
      <label class="mini"><input type="checkbox" id="dragMode" checked> Drag</label>
      <label class="mini"><input type="checkbox" id="cycleMode"> Siklus</label>
    </div>
  </div>

  <div class="table-wrap">
    <table id="tabel">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="hint">✅=H &nbsp; 🤒=S &nbsp; ❌=A &nbsp; • Keys: H S A Del + panah</div>

  <div class="panel">
    <div class="row">
      <div class="field"><div style="display:flex;gap:4px"><input type="text" id="newNama" placeholder="Nama" style="min-width:140px"><input type="text" id="newNim" placeholder="NIM" style="min-width:90px"><button id="btnAddMhs">+</button></div></div>
      <div class="field"><div style="display:flex;gap:4px"><input type="text" id="newMatkul" placeholder="Matkul"><button id="btnAddMatkul">+</button></div></div>
    </div>
  </div>
</main>

<script src="data-matkul.js"></script>
<script src="data-mahasiswa.js"></script>
<script>
const EMOT = {H:"✅", S:"🤒", A:"❌", "":""};
const NEXT = {"":"H","H":"S","S":"A","A":""};

const LS_KEY = "mahasigma_absensi_v2";
let state = { courses:[...DEFAULT_COURSES], students:JSON.parse(JSON.stringify(DEFAULT_STUDENTS)), meetings:{}, data:{}, current:DEFAULT_COURSES[0] };

function defaultMeetings(){ const o={}; state.courses.forEach(c=>o[c]=16); return o; }

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ state.meetings = defaultMeetings(); return; }
    const s = JSON.parse(raw);
    if(s.courses?.length) state.courses = s.courses;
    if(s.students?.length) state.students = s.students;
    state.meetings = s.meetings || defaultMeetings();
    state.data = s.data || {};
    state.current = s.current && state.courses.includes(s.current) ? s.current : state.courses[0];
    state.courses.forEach(c=>{ if(!state.meetings[c]) state.meetings[c]=16; else if(state.meetings[c]===14) state.meetings[c]=16; });
  }catch(e){ state.meetings = defaultMeetings(); }
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  document.getElementById("saveInfo").textContent = new Date().toLocaleTimeString("id-ID",{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function getVal(course, sid, meet){ return (state.data[course]?.[sid]?.[meet]) || ""; }
function setVal(course, sid, meet, v){
  if(!state.data[course]) state.data[course]= {};
  if(!state.data[course][sid]) state.data[course][sid]= {};
  if(!v) delete state.data[course][sid][meet];
  else state.data[course][sid][meet]=v;
}

const $ = id => document.getElementById(id);
let brush = "H", selected = null, isPainting = false, paintValue = null;

function renderCourseSelect(){
  const sel = $("courseSelect"); sel.innerHTML="";
  state.courses.forEach(c=>{
    const o=document.createElement("option"); o.value=c; o.textContent=c;
    if(c===state.current) o.selected=true;
    sel.appendChild(o);
  });
}

function hitungRekap(sid){
  const course=state.current, n=state.meetings[course];
  let h=0,s=0,a=0,k=0;
  for(let m=0;m<n;m++){ const v=getVal(course,sid,m); if(v==="H")h++; else if(v==="S")s++; else if(v==="A")a++; else k++; }
  const pct = n? Math.round(h/n*100) : 0;
  return {h,s,a,k,pct};
}

function visibleStudents(){
  const q=$("search").value.trim().toLowerCase(), f=$("filter").value;
  return state.students.filter(st=>{
    if(q && !(st.nama.toLowerCase().includes(q)||st.nim.toLowerCase().includes(q))) return false;
    const r=hitungRekap(st.id);
    if(f==="kritis" && r.pct>=75) return false;
    if(f==="belum" && r.k===0) return false;
    return true;
  });
}

function render(){
  renderCourseSelect();
  const course=state.current, n=state.meetings[course];
  $("meetCount").value=n; $("stMeet").textContent=n;

  let th=`<tr><th class="col-no">No</th><th class="col-nama">Nama</th><th class="col-nim">NIM</th>`;
  for(let m=0;m<n;m++){
    th+=`<th>P${m+1}<div class="col-tools"><button data-fill="${m}">✅</button><button data-clear="${m}">∅</button></div></th>`;
  }
  th+=`<th class="rekap">H</th><th class="rekap">S</th><th class="rekap">A</th><th class="rekap">%</th></tr>`;
  $("thead").innerHTML=th;

  const list=visibleStudents(), tb=$("tbody"); tb.innerHTML="";
  list.forEach((st,idx)=>{
    const r=hitungRekap(st.id);
    const tr=document.createElement("tr");
    tr.dataset.sid=st.id;
    let tds=`<td class="col-no">${idx+1}</td>
      <td class="col-nama">${st.nama} <button data-del="${st.id}" style="float:right;border:none;color:#999">✕</button></td>
      <td class="col-nim">${st.nim}</td>`;
    for(let m=0;m<n;m++){
      const v=getVal(course,st.id,m);
      tds+=`<td><button class="cell" data-s="${v}" data-sid="${st.id}" data-meet="${m}">${EMOT[v]||'<span style="color:#cbd5e1">·</span>'}</button></td>`;
    }
    const cls = r.pct<75 ? "kritik" : "aman";
    tds+=`<td class="rekap">${r.h}</td><td class="rekap">${r.s}</td><td class="rekap">${r.a}</td><td class="rekap ${cls}">${r.pct}</td>`;
    tr.innerHTML=tds;
    tb.appendChild(tr);
  });

  let th2=0, krit=0;
  state.students.forEach(st=>{ const r=hitungRekap(st.id); th2+=r.h; if(r.pct<75) krit++; });
  const totalSel = state.students.length*n || 1;
  $("stMhs").textContent=state.students.length;
  $("stHadir").textContent=th2;
  $("stAvg").textContent=Math.round(th2/totalSel*100)+"%";
  $("stKritis").textContent=krit;
  wireCells();
  if(selected) markSelected();
}

function wireCells(){
  document.querySelectorAll(".cell").forEach(btn=>{
    btn.onmousedown = e=>{
      e.preventDefault();
      const cycle=$("cycleMode").checked;
      const sid=btn.dataset.sid, m=+btn.dataset.meet;
      if(cycle){
        const cur=getVal(state.current,sid,m);
        setVal(state.current,sid,m,NEXT[cur]); save(); render();
        selectCell(sid,m);
      } else {
        paintValue = brush==="E" ? "" : brush;
        isPainting=true;
        setVal(state.current,sid,m,paintValue); save(); render();
        selectCell(sid,m);
      }
    };
    btn.onmouseenter = e=>{
      if(isPainting && $("dragMode").checked){
        const sid=btn.dataset.sid, m=+btn.dataset.meet;
        if(getVal(state.current,sid,m)!==paintValue){ setVal(state.current,sid,m,paintValue); }
        btn.dataset.s=paintValue; btn.innerHTML=EMOT[paintValue]||'<span style="color:#cbd5e1">·</span>';
      }
    };
    btn.onmouseup = ()=>{ if(isPainting){isPainting=false; save(); render();} };
    btn.onclick = e=>{ selectCell(btn.dataset.sid, +btn.dataset.meet); };
  });
  document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{
    const m=+b.dataset.fill;
    visibleStudents().forEach(st=>setVal(state.current,st.id,m,"H"));
    save(); render();
  });
  document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
    const m=+b.dataset.clear;
    visibleStudents().forEach(st=>setVal(state.current,st.id,m,""));
    save(); render();
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!confirm("Hapus?")) return;
    state.students = state.students.filter(s=>s.id!==b.dataset.del);
    save(); render();
  });
}
document.addEventListener("mouseup", ()=>{ if(isPainting){isPainting=false; save(); render();} });

function selectCell(sid,m){ selected={sid,m}; markSelected(); }
function markSelected(){
  document.querySelectorAll(".cell").forEach(c=>{
    c.classList.toggle("selected", selected && c.dataset.sid===selected.sid && +c.dataset.meet===selected.m);
  });
}

document.addEventListener("keydown", e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(!selected) return;
  const k=e.key.toLowerCase();
  let v=null, move=null;
  if(k==="h") v="H"; else if(k==="s") v="S"; else if(k==="a"||k==="x") v="A";
  else if(k==="delete"||k==="backspace") v="";
  else if(k==="arrowright") move=[0,1];
  else if(k==="arrowleft") move=[0,-1];
  else if(k==="arrowdown") move=[1,0];
  else if(k==="arrowup") move=[-1,0];
  else return;
  e.preventDefault();
  if(v!==null){ setVal(state.current,selected.sid,selected.m,v); save(); render(); markSelected(); }
  if(move){
    const rows=visibleStudents(); const n=state.meetings[state.current];
    let ri=rows.findIndex(r=>r.id===selected.sid), ci=selected.m;
    ri=Math.min(Math.max(ri+move[0],0),rows.length-1);
    ci=Math.min(Math.max(ci+move[1],0),n-1);
    selected={sid:rows[ri].id,m:ci}; markSelected();
    const el=document.querySelector(`.cell[data-sid="${selected.sid}"][data-meet="${selected.m}"]`);
    el?.scrollIntoView({block:"nearest",inline:"nearest"});
  }
});

$("courseSelect").onchange = e=>{ state.current=e.target.value; selected=null; save(); render(); };
$("meetCount").onchange = e=>{ let v=Math.min(Math.max(+e.target.value||1,1),30); state.meetings[state.current]=v; save(); render(); };
$("meetPlus").onclick = ()=>{ state.meetings[state.current]=Math.min(state.meetings[state.current]+1,30); save(); render(); };
$("meetMinus").onclick = ()=>{ state.meetings[state.current]=Math.max(state.meetings[state.current]-1,1); save(); render(); };
$("search").oninput = render;
$("filter").onchange = render;
$("brushes").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  brush=b.dataset.brush;
  document.querySelectorAll("#brushes button").forEach(x=>x.classList.toggle("active",x===b));
};
$("btnHadirSemua").onclick = ()=>{
  if(!confirm("✅ semua?")) return;
  const n=state.meetings[state.current];
  visibleStudents().forEach(st=>{ for(let m=0;m<n;m++) setVal(state.current,st.id,m,"H"); });
  save(); render();
};
$("btnReset").onclick = ()=>{
  if(!confirm("Reset?")) return;
  delete state.data[state.current]; save(); render();
};
$("btnAddMhs").onclick = ()=>{
  const nama=$("newNama").value.trim(), nim=$("newNim").value.trim()||("5252451"+String(state.students.length+1).padStart(3,"0"));
  if(!nama) return;
  state.students.push({id:"mhs-"+Date.now(),nim,nama});
  $("newNama").value=""; $("newNim").value=""; save(); render();
};
$("btnAddMatkul").onclick = ()=>{
  const v=$("newMatkul").value.trim(); if(!v) return;
  if(state.courses.includes(v)) return;
  state.courses.push(v); state.meetings[v]=16; state.current=v;
  $("newMatkul").value=""; save(); render();
};
$("btnExport").onclick = ()=>{
  const course=state.current, n=state.meetings[course];
  let csv="No;NIM;Nama;"+Array.from({length:n},(_,i)=>"P"+(i+1)).join(";")+";H;S;A;%\n";
  state.students.forEach((st,i)=>{
    const r=hitungRekap(st.id);
    const row=Array.from({length:n},(_,m)=>getVal(course,st.id,m)||"-").join(";");
    csv+=`${i+1};${st.nim};"${st.nama}";${row};${r.h};${r.s};${r.a};${r.pct}\n`;
  });
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="absensi-"+course.replace(/\s+/g,"-")+".csv";
  a.click();
};

load(); render();
</script>
</body>
</html>
